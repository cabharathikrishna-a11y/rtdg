name: Automated Public Release & Firebase App Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release_pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Gives the cloud runner permission to create a public release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Decode Keystore & Resolve Firebase Config
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        REPO_OWNER: ${{ github.repository_owner }}
      shell: python
      run: |
        import base64
        import json
        import os
        import re
        import subprocess
        import sys
        import urllib.request

        owner = os.environ.get("REPO_OWNER", "cabharathikrishna-a11y").strip() or "cabharathikrishna-a11y"
        candidate_owners = []
        for o in [owner, "cabharathikrishna-a11y"]:
            if o and o not in candidate_owners:
                candidate_owners.append(o)

        def fetch_from_secrets_repo(filename):
            for o in candidate_owners:
                for branch in ["main", "master"]:
                    url = f"https://raw.githubusercontent.com/{o}/Secrets/{branch}/{filename}"
                    try:
                        req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions"})
                        with urllib.request.urlopen(req, timeout=15) as resp:
                            if resp.status == 200:
                                content = resp.read().decode("utf-8", errors="replace").strip()
                                if content:
                                    print(f"Fetched {filename} from {o}/Secrets ({branch}).")
                                    return content
                    except Exception:
                        pass
            return ""

        # 1. Resolve Keystore Base64 (GitHub Secrets -> local file -> Secrets repo)
        keystore_b64 = os.environ.get("KEYSTORE_BASE64", "").strip()

        if keystore_b64:
            print("Found keystore base64 in environment variables (GitHub Secrets).")
        elif os.path.exists("debug.keystore.base64"):
            with open("debug.keystore.base64", "r", encoding="utf-8", errors="ignore") as f:
                keystore_b64 = f.read().strip()
            print("Found checked-in debug.keystore.base64 file.")
        else:
            print("KEYSTORE_BASE64 not in env or local disk. Fetching debug.keystore.base64 from Secrets repo...")
            keystore_b64 = fetch_from_secrets_repo("debug.keystore.base64")
            if keystore_b64:
                with open("debug.keystore.base64", "w", encoding="utf-8") as f:
                    f.write(keystore_b64)

        if keystore_b64:
            valid_chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
            cleaned_b64 = keystore_b64.replace("_", "/").replace("-", "+")
            cleaned_b64 = "".join(c for c in cleaned_b64 if c in valid_chars)
            padded_b64 = cleaned_b64 + "=" * (-len(cleaned_b64) % 4)
            try:
                decoded_bytes = base64.b64decode(padded_b64)
                if len(decoded_bytes) > 0:
                    with open("debug.keystore", "wb") as f:
                        f.write(decoded_bytes)
                    print("Successfully decoded and wrote debug.keystore.")
            except Exception as e:
                print(f"Warning decoding keystore base64: {e}")

        # Fallback: if debug.keystore still does not exist, generate one so the build never fails
        if not os.path.exists("debug.keystore") or os.path.getsize("debug.keystore") == 0:
            print("Generating fallback debug.keystore via keytool...")
            subprocess.run([
                "keytool", "-genkeypair", "-v",
                "-keystore", "debug.keystore",
                "-storetype", "PKCS12",
                "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                "-alias", "androiddebugkey",
                "-storepass", "android", "-keypass", "android",
                "-dname", "CN=Android Debug,O=Android,C=US"
            ], check=True)
            print("Generated fallback debug.keystore successfully.")

        # 2. Fetch .env from Secrets repo if missing or placeholder
        need_env = True
        if os.path.exists(".env"):
            with open(".env", "r", encoding="utf-8", errors="ignore") as f:
                existing_env = f.read()
            if existing_env.strip() and "YOUR_GEMINI_API_KEY_HERE" not in existing_env:
                need_env = False
        if need_env:
            env_content = fetch_from_secrets_repo(".env")
            if env_content:
                with open(".env", "w", encoding="utf-8") as f:
                    f.write(env_content + "\n")
                print("Updated .env from Secrets repository.")

        # 3. Fetch google-services.json from Secrets repo and ensure current applicationId is registered
        gs_content = fetch_from_secrets_repo("google-services.json")
        if not gs_content and os.path.exists("app/google-services.json"):
            with open("app/google-services.json", "r", encoding="utf-8", errors="ignore") as f:
                gs_content = f.read()

        detected_firebase_app_id = ""
        if gs_content:
            try:
                gs_json = json.loads(gs_content)
                app_id = None
                if os.path.exists("app/build.gradle.kts"):
                    with open("app/build.gradle.kts", "r", encoding="utf-8", errors="ignore") as bf:
                        m = re.search(r'applicationId\s*=\s*"([^"]+)"', bf.read())
                        if m:
                            app_id = m.group(1)
                clients = gs_json.get("client", [])
                if isinstance(clients, list) and len(clients) > 0:
                    # Extract mobilesdk_app_id from matching client or first client
                    for c in clients:
                        if isinstance(c, dict):
                            pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                            mob_id = c.get("client_info", {}).get("mobilesdk_app_id", "")
                            if mob_id and (pkg == app_id or not detected_firebase_app_id):
                                detected_firebase_app_id = mob_id
                    if app_id:
                        has_pkg = any(
                            c.get("client_info", {}).get("android_client_info", {}).get("package_name") == app_id
                            for c in clients if isinstance(c, dict)
                        )
                        if not has_pkg:
                            cloned_client = json.loads(json.dumps(clients[0]))
                            cloned_client.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = app_id
                            clients.append(cloned_client)
                            gs_json["client"] = clients
                            print(f"Added package_name '{app_id}' to google-services.json clients.")
                os.makedirs("app", exist_ok=True)
                with open("app/google-services.json", "w", encoding="utf-8") as f:
                    json.dump(gs_json, f, indent=2)
                print("Verified app/google-services.json.")
            except Exception as e:
                print(f"Warning updating google-services.json: {e}")

        # 4. Resolve FIREBASE_APP_ID, FIREBASE_CREDENTIALS, and FIREBASE_TOKEN from Secrets repo / google-services.json
        github_env_path = os.environ.get("GITHUB_ENV", "")
        if github_env_path:
            fb_app_id = fetch_from_secrets_repo("FIREBASE_APP_ID")
            final_app_id = (fb_app_id.splitlines()[0].strip() if fb_app_id else "") or detected_firebase_app_id or "1:455008013486:android:531e28ee052201e9a5f13f"
            with open(github_env_path, "a", encoding="utf-8") as envf:
                envf.write(f"FALLBACK_FIREBASE_APP_ID={final_app_id}\n")
            print(f"Resolved Firebase App ID: {final_app_id}")

            for cred_name in ["FIREBASE_CREDENTIALS", "FIREBASE_SERVICE_ACCOUNT", "service-account.json", "firebase-adminsdk.json"]:
                fb_creds = fetch_from_secrets_repo(cred_name)
                if fb_creds:
                    with open("firebase-secrets-repo-key.json", "w", encoding="utf-8") as cf:
                        cf.write(fb_creds)
                    print(f"Loaded Firebase service account credentials from {cred_name}.")
                    break

            fb_token = fetch_from_secrets_repo("FIREBASE_TOKEN")
            if fb_token:
                with open(github_env_path, "a", encoding="utf-8") as envf:
                    envf.write(f"FALLBACK_FIREBASE_TOKEN={fb_token.splitlines()[0].strip()}\n")

    - name: Get Version Info
      id: get_version
      run: |
        LOCAL_CODE=$(grep -E 'versionCode\s*=\s*customCode\s*\?\:\s*[0-9]+' app/build.gradle.kts | sed -E 's/.*versionCode\s*=\s*customCode\s*\?\:\s*([0-9]+).*/\1/')
        if [ -z "$LOCAL_CODE" ] || ! [[ "$LOCAL_CODE" =~ ^[0-9]+$ ]]; then
          LOCAL_CODE=7
        fi
        
        echo "Local fallback versionCode is $LOCAL_CODE"
        
        # Query Firebase Realtime Database for the last successful build's version code
        DB_VAL=$(curl -s "https://collection-app-2007-default-rtdb.asia-southeast1.firebasedatabase.app/versionId.json" | tr -d '"')
        echo "Firebase DB versionId is: $DB_VAL"
        if [ "$DB_VAL" = "null" ]; then
          DB_VAL=""
        fi
        
        NEW_VERSION_CODE=""
        
        if [ -n "$DB_VAL" ] && [[ "$DB_VAL" =~ ^[0-9]+$ ]]; then
          NEW_VERSION_CODE=$((DB_VAL + 1))
          echo "Determined version code from Firebase DB: $NEW_VERSION_CODE"
        else
          echo "Firebase DB fetch was invalid or empty. Trying GitHub Releases latest tag..."
          # Fetch latest release tag from GitHub API
          GH_TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -oP '"tag_name": "\s*v1.0.\K[0-9]+')
          if [ -n "$GH_TAG" ] && [[ "$GH_TAG" =~ ^[0-9]+$ ]]; then
            NEW_VERSION_CODE=$((GH_TAG + 1))
            echo "Determined version code from GitHub latest release: $NEW_VERSION_CODE"
          else
            NEW_VERSION_CODE=$((LOCAL_CODE + 1))
            echo "Fallback to incremented local code: $NEW_VERSION_CODE"
          fi
        fi
        
        NEW_VERSION_NAME="${NEW_VERSION_CODE}.0"
        
        echo "Final VERSION_CODE: $NEW_VERSION_CODE"
        echo "Final VERSION_NAME: $NEW_VERSION_NAME"
        
        echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
        echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT

    # Compile the automated release APK using the dynamically determined versionCode and versionName
    - name: Compile Automated Release APK
      env:
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
        RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || secrets.STORE_TYPE || secrets.SIGNING_STORE_TYPE }}
      run: ./gradlew assembleRelease -PcustomVersionCode=${{ env.VERSION_CODE }} -PcustomVersionName="${{ env.VERSION_NAME }}"

    # 1. First create the Public GitHub Release and upload the compiled APK
    - name: Generate Public GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ env.VERSION_CODE }}
        name: Release v1.0.${{ env.VERSION_CODE }}
        body: |
          Automated build updates compiled successfully via GitHub Actions.
          Tracking Identifier: Build #${{ github.run_number }} (Version Code: ${{ env.VERSION_CODE }}, Version Name: ${{ env.VERSION_NAME }})
        files: app/build/outputs/apk/release/app-release.apk

    # 2. Update Firebase Realtime Database Update Config with the new Public Release APK URL
    - name: Update Firebase Realtime Database Update Config
      run: |
        VERSION_CODE=${{ env.VERSION_CODE }}
        REPO_NAME="${{ github.repository }}"
        APK_URL="https://github.com/${REPO_NAME}/releases/download/v1.0.$VERSION_CODE/app-release.apk"
        
        OWNER=$(echo "$REPO_NAME" | cut -d'/' -f1)
        REPO=$(echo "$REPO_NAME" | cut -d'/' -f2)
        
        # Update update_config.json
        curl -X PUT -H "Content-Type: application/json" \
          -d "{\"versionId\": $VERSION_CODE, \"versionName\": \"1.0.$VERSION_CODE\", \"apkFileId\": \"$APK_URL\", \"githubOwner\": \"$OWNER\", \"githubRepo\": \"$REPO\"}" \
          "https://collection-app-2007-default-rtdb.asia-southeast1.firebasedatabase.app/update_config.json"
          
        # Update versionId.json
        curl -X PUT -H "Content-Type: application/json" \
          -d "$VERSION_CODE" \
          "https://collection-app-2007-default-rtdb.asia-southeast1.firebasedatabase.app/versionId.json"

    # 3. After Public GitHub Release, upload and release the APK in Firebase App Distribution Center
    - name: Upload & Release APK in Firebase App Distribution Center
      continue-on-error: true
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || env.FALLBACK_FIREBASE_TOKEN }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || env.FALLBACK_FIREBASE_APP_ID || '1:455008013486:android:531e28ee052201e9a5f13f' }}
        FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
        FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "Release APK not found at $APK_PATH"
          exit 1
        fi

        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-key.json
        elif [ -f "firebase-secrets-repo-key.json" ]; then
          cp firebase-secrets-repo-key.json firebase-key.json
        fi

        # Validate if firebase-key.json is base64 encoded or raw JSON
        if [ -f "firebase-key.json" ]; then
          python3 - << 'EOF'
        import base64, json
        with open("firebase-key.json", "r", encoding="utf-8", errors="ignore") as f:
            raw = f.read().strip()
        if raw and not raw.startswith("{"):
            try:
                decoded = base64.b64decode(raw).decode("utf-8")
                if decoded.strip().startswith("{"):
                    with open("firebase-key.json", "w", encoding="utf-8") as out:
                        out.write(decoded)
                    print("Decoded base64 FIREBASE_CREDENTIALS into JSON key.")
            except Exception as e:
                print(f"Note checking base64 service account: {e}")
        EOF
        fi

        RELEASE_NOTES="Public Release v1.0.${{ env.VERSION_CODE }} (Build #${{ github.run_number }}). Uploaded automatically after GitHub Public Release."
        TOKEN_ARGS=""

        if [ -f "firebase-key.json" ] && grep -q '"private_key"' firebase-key.json; then
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-key.json"
          echo "Using Service Account credentials (GOOGLE_APPLICATION_CREDENTIALS) for Firebase App Distribution."
        elif [ -n "$FIREBASE_TOKEN" ]; then
          TOKEN_ARGS="--token \"$FIREBASE_TOKEN\""
          echo "Using FIREBASE_TOKEN for Firebase App Distribution."
        else
          echo "::warning::Neither FIREBASE_CREDENTIALS service account JSON nor FIREBASE_TOKEN was found in GitHub Secrets or Secrets repo. Add FIREBASE_CREDENTIALS or FIREBASE_TOKEN to enable Firebase App Distribution uploads."
          exit 0
        fi

        GROUPS_TO_USE="${FIREBASE_GROUPS:-testers}"
        TESTERS_TO_USE="${FIREBASE_TESTERS}"

        echo "Uploading APK to Firebase App Distribution (App ID: $FIREBASE_APP_ID)..."
        DIST_CMD="npx -y firebase-tools@latest appdistribution:distribute \"$APK_PATH\" --app \"$FIREBASE_APP_ID\" --release-notes \"$RELEASE_NOTES\" $TOKEN_ARGS"

        # Try distributing with groups/testers first; if the group or tester doesn't exist yet in Firebase Console, fall back to uploading the release directly so it still appears in Firebase App Distribution Center!
        if [ -n "$TESTERS_TO_USE" ]; then
          eval "$DIST_CMD --groups \"$GROUPS_TO_USE\" --testers \"$TESTERS_TO_USE\"" || eval "$DIST_CMD --testers \"$TESTERS_TO_USE\"" || eval "$DIST_CMD"
        else
          eval "$DIST_CMD --groups \"$GROUPS_TO_USE\"" || eval "$DIST_CMD"
        fi

        rm -f firebase-key.json firebase-secrets-repo-key.json
